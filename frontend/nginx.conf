server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Same-origin API proxy (docker-compose service name "backend")
  location /api/ {
    proxy_pass http://backend:10000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /mediapipe/ { expires 30d; add_header Cache-Control "public"; types { application/wasm wasm; application/javascript js; } try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  # 'wasm-unsafe-eval' is required by MediaPipe's WebAssembly runtime; the pose model is fetched from storage.googleapis.com.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://storage.googleapis.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
